<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报销网站 · 访问测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:#20332c;font:16px/1.7 system-ui,sans-serif;padding:32px 20px}main{max-width:600px;margin:6vh auto;background:white;padding:32px;border:1px solid #dce5df;border-radius:20px}.label{font-size:13px;letter-spacing:2px;color:#34775c}h1{font-size:28px;line-height:1.3}p{color:#53685d}.note{padding:16px;background:#fff7e8;border-radius:10px;color:#725521}button{width:100%;padding:15px;background:#23664a;color:white;border:0;border-radius:10px;font-size:17px;cursor:pointer}button:disabled{opacity:.6}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #e8edea}small{color:#66776e}#result{white-space:pre-line;font-weight:600}footer{margin-top:24px;font-size:13px;color:#66776e}
</style>
<main>
<div class="label">员工报销汇总</div>
<h1>先确认，链接能顺利打开</h1>
<p>请关闭 VPN，分别用手机流量和公司 Wi-Fi 打开本页，再运行测试。</p>
<p class="note">这是访问测试页，还不能申报报销。不收集姓名、发票或支付截图，也不保存测试内容。</p>
<ul><li>① 网页加载：已成功</li><li id="api">② 后台连接：等待测试</li><li id="upload">③ 少量测试数据传输：等待测试</li></ul>
<button id="run" type="button">开始访问测试</button>
<p id="result" role="status" aria-live="polite"></p>
<small>免费服务器首次唤醒可能需要约一分钟。测试不代表完整图片上传、识别或数据存储已经可用。</small>
<footer>只验证网页、后台接口和少量数据传输。收到测试结果后，再继续搭建正式功能。</footer>
</main>
<script>
const button=document.querySelector('#run');
async function call(path,options={}){const start=performance.now();const response=await fetch(path,{...options,cache:'no-store',signal:AbortSignal.timeout(90000)});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!data.ok)throw Error('后台返回异常');return {data,ms:Math.round(performance.now()-start)}}
button.addEventListener('click',async()=>{button.disabled=true;document.querySelector('#result').textContent='正在测试，请稍候…';document.querySelector('#api').textContent='② 后台连接：测试中';document.querySelector('#upload').textContent='③ 少量测试数据传输：等待测试';try{const health=await call('/health');document.querySelector('#api').textContent='② 后台连接：成功（'+health.ms+' 毫秒）';const upload=await call('/upload-test',{method:'POST',headers:{'Content-Type':'text/plain'},body:'access-test-'.repeat(80)});if(upload.data.saved!==false||upload.data.bytes!==960)throw Error('测试响应不符合预期');document.querySelector('#upload').textContent='③ 少量测试数据传输：成功（'+upload.ms+' 毫秒）';document.querySelector('#result').textContent='三项测试通过。请把你使用的网络及测试结果告诉我。'}catch(error){document.querySelector('#result').textContent='测试未通过：'+error.message+'。请告诉我停在哪一步。'}finally{button.disabled=false}});
</script>
</html>
